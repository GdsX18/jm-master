# Stack de produção da VPS: PostgreSQL + app Next.js + Caddy (HTTPS automático).
# Variáveis em .env.production (modelo: .env.production.example). Passo a passo: deploy/HOSTINGER.md
#
#   docker compose --env-file .env.production up -d db               sobe o banco (precisa estar de pé para o build)
#   docker compose --env-file .env.production run --rm migrate       aplica migrations pendentes
#   docker compose --env-file .env.production up -d --build          builda e sobe app + caddy

name: jm-master

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jm_master}
      POSTGRES_USER: ${POSTGRES_USER:-jm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    # Só acessível de dentro da VPS (use túnel SSH para conectar de fora)
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      target: tools
    profiles: ["tools"]
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jm_master}
      DIRECT_URL: postgresql://${POSTGRES_USER:-jm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jm_master}
      STORAGE_DIR: /app/storage
    volumes:
      - storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]

  app:
    build:
      context: .
      # O build lê o banco pela porta 127.0.0.1:5432 da VPS: suba o "db" antes de buildar
      network: host
      args:
        DATABASE_URL: postgresql://${POSTGRES_USER:-jm}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB:-jm_master}
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jm_master}
      DIRECT_URL: postgresql://${POSTGRES_USER:-jm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jm_master}
    volumes:
      - storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
